<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">

    <title>Dashboard</title>
</head>

<body>

    <h1>Dashboard</h1>

    <p>
        Selamat datang, {{ current_user.full_name }}
    </p>

    <p>
        Emel: {{ current_user.email }}
    </p>

    <p>
        Role: {{ current_user.role }}
    </p>

    <p>
        <a href="{{ url_for('auth.logout') }}">
            Log Keluar
        </a>
    </p>

    {% if current_user.role == "ADMIN" %}

    <p>
        <a href="{{ url_for('admin.rooms') }}">
            Pengurusan Bilik Mesyuarat
        </a>
    </p>

    {% endif %}
</body>
</html>
