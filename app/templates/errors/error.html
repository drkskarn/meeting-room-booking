<!DOCTYPE html>
<html lang="ms">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ status_code }} - {{ title }}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="error-page">

        <div class="error-card">

            <div class="error-code">
                {{ status_code }}
            </div>

            <h1>
                {{ title }}
            </h1>

            <p>
                {{ message }}
            </p>

            <a
                href="{{ url_for('auth.login') }}"
                class="btn btn-primary"
            >
                Kembali
            </a>

        </div>

    </main>

</body>

</html>
